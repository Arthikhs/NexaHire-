services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth:
    build: ./services/auth
    ports:
      - "5000:5000"
    depends_on: [kafka, redis, utils]
    env_file: ./services/auth/.env
    environment:
      Kafka_Broker: kafka:9092
      Redis_url: redis://redis:6379
      UPLOAD_SERVICE: http://utils:5001
      Frontend_Url: http://3.110.22.108:3000

  utils:
    build: ./services/utils
    ports:
      - "5001:5001"
    depends_on: [kafka]
    env_file: ./services/utils/.env
    environment:
      Kafka_Broker: kafka:9092

  user:
    build: ./services/user
    ports:
      - "5002:5002"
    depends_on: [utils]
    env_file: ./services/user/.env
    environment:
      UPLOAD_SERVICE: http://utils:5001

  job:
    build: ./services/job
    ports:
      - "5003:5003"
    depends_on: [kafka, redis, utils]
    env_file: ./services/job/.env
    environment:
      Kafka_Broker: kafka:9092
      Redis_url: redis://redis:6379
      UPLOAD_SERVICE: http://utils:5001

  payment:
    build: ./services/payment
    ports:
      - "5004:5004"
    env_file: ./services/payment/.env

  tracker:
    build: ./services/tracker
    ports:
      - "5005:5005"
    depends_on: [redis]
    env_file: ./services/tracker/.env
    environment:
      Redis_url: redis://redis:6379

  insights:
    build: ./services/insights
    ports:
      - "5006:5006"
    env_file: ./services/insights/.env

  feed:
    build: ./services/feed
    ports:
      - "5007:5007"
    depends_on: [redis]
    env_file: ./services/feed/.env
    environment:
      Redis_url: redis://redis:6379

  questions:
    build: ./services/questions
    ports:
      - "5008:5008"
    env_file: ./services/questions/.env

  referral:
    build: ./services/referral
    ports:
      - "5009:5009"
    env_file: ./services/referral/.env

  opensource:
    build: ./services/opensource
    ports:
      - "5010:5010"
    env_file: ./services/opensource/.env

  messaging:
    build: ./services/messaging
    ports:
      - "5011:5011"
    env_file: ./services/messaging/.env

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on: [auth, utils, user, job, payment, tracker, insights, feed, questions, referral, opensource, messaging]
    environment:
      NEXT_PUBLIC_AUTH_SERVICE: http://3.110.22.108:5000
      NEXT_PUBLIC_UTILS_SERVICE: http://3.110.22.108:5001
      NEXT_PUBLIC_USER_SERVICE: http://3.110.22.108:5002
      NEXT_PUBLIC_JOB_SERVICE: http://3.110.22.108:5003
      NEXT_PUBLIC_PAYMENT_SERVICE: http://3.110.22.108:5004
      NEXT_PUBLIC_TRACKER_SERVICE: http://3.110.22.108:5005
      NEXT_PUBLIC_INSIGHTS_SERVICE: http://3.110.22.108:5006
      NEXT_PUBLIC_FEED_SERVICE: http://3.110.22.108:5007
      NEXT_PUBLIC_QUESTIONS_SERVICE: http://3.110.22.108:5008
      NEXT_PUBLIC_REFERRAL_SERVICE: http://3.110.22.108:5009
      NEXT_PUBLIC_OPENSOURCE_SERVICE: http://3.110.22.108:5010
      NEXT_PUBLIC_MESSAGING_SERVICE: http://3.110.22.108:5011
